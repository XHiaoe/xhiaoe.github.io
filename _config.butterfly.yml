# 导航栏
nav:
  logo: /img/favicon.png
  display_title: true
  fixed: false

# 网站图标
favicon: /img/favicon.png

# 头像
avatar:
  img: /images/avatar.jpg
  effect: false        # 头像动画，建议关闭

# 顶部图
default_top_img: /img/banner.jpg
index_img: /img/banner.jpg
archive_img: /img/bg.jpg
tag_img: /img/bg.jpg
category_img: /img/bg.jpg

# 背景图
background: /img/bg.jpg

# 代码高亮
highlight_theme: mac

# 深色模式
darkmode:
  enable: true
  button: true
  autoChangeMode: 2

# 打字机效果
subtitle:
  enable: true
  loop: true
  source: false
  sub: 
    - 欢迎来到我的博客
    - 记录技术与生活

# 搜索（需要插件 hexo-generator-searchdb，站点级参数配在 _config.yml 里）
search:
  use: local_search        # 可选 algolia_search / local_search / docsearch，留空则不显示搜索
  placeholder: 搜索
  local_search:
    preload: false         # 页面加载时预加载搜索数据
    top_n_per_article: 1   # 每篇文章最多显示几条匹配，-1 为全部
    unescape: false        # 是否把 html 转义还原成可读文本
    pagination:
      enable: false
      hitsPerPage: 8

# 懒加载
lazyload:
  enable: true
  native: false
  field: site
  blur: true

# 字数统计
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true
